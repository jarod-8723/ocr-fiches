<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau des fiches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@300..800&family=STIX+Two+Text:ital,wght@1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght,BNCE,INFM,SPAC@300..800,-100..100,0..100,0..100&display=swap">
<style>
/* VOICE  quotidien d'étude : dessin enfantin, maths sérieuses
   IDEA   le tableau blanc d'une salle de cours ; feuilles à petits carreaux tenues par des aimants
   PICTURE le tableau entier : feuilles, aimants géométriques, gribouillis de maths au feutre
   COLOUR mur rose #FFD3E6, tableau #FDFDFB, encre #2B2440, feutre rose #FF4F9A, étoile #FFC93C, carreaux #DCE6F6
   TYPE   Shantell Sans variable (feutre, axes INFM et BNCE) + STIX Two Text italique (maths)
   LAYOUT tableau plein écran, titre en haut à gauche, années en ligne ; téléphone : deux colonnes, zoom caméra sur les matières */
:root{color-scheme:light dark;--mur:#FFD3E6;--mur:light-dark(#FFD3E6,#29142F);--pois:#FFBFDA;--pois:light-dark(#FFBFDA,#3B1E45);--encre:#2B2440;--gris:#6D6580;--rose:#FF4F9A;--jaune:#FFC93C;--carreau:#DCE6F6;--marge:#FF9DC5;--papier:#FFFDF9}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(var(--pois) 1.5px,transparent 1.7px) 0 0/24px 24px var(--mur);color:var(--encre);font:16px/1.4 "Shantell Sans","Segoe Print","Comic Sans MS",cursive;font-variation-settings:"INFM" 30;overflow:hidden;-webkit-tap-highlight-color:transparent}
main{position:fixed;inset:0;overflow:hidden}
#monde{position:absolute;inset:0;transform-origin:0 0}
.cadre{position:absolute;border-radius:16px;background:linear-gradient(#F7F8FA,#C2C7D0);box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 rgba(43,36,64,.14),0 24px 44px -24px rgba(60,16,48,.6)}
.surface{position:absolute;border-radius:7px;background:linear-gradient(112deg,transparent 28%,rgba(255,255,255,.95) 42%,transparent 58%),radial-gradient(120% 95% at 40% 28%,#fff 48%,#EDEDE9);box-shadow:inset 0 1px 6px rgba(43,36,64,.2)}
.rebord{position:absolute;border-radius:5px 5px 12px 12px;background:linear-gradient(#FCFCFD,#BCC1CB 65%,#9EA4B0);box-shadow:0 12px 18px -12px rgba(50,16,40,.7)}
.feutres{position:absolute;overflow:visible}
.craie{position:absolute;overflow:hidden;pointer-events:none}
.craie path,.ic path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.c-rose{stroke:var(--rose);stroke-width:2.6}
.c-encre{stroke:var(--encre);stroke-width:2.3}
.c-gros{stroke:var(--rose);stroke-width:5}
.c-trace{stroke:#7E7790;stroke-width:20;opacity:.05}
.ic .c-rose{stroke-width:3.6}
.ic .c-encre{stroke-width:3.2}
.craie .c-plein,.ic .c-plein{fill:var(--rose);stroke:none}
.craie .c-jaune,.ic .c-jaune{fill:var(--jaune);stroke:none}
.craie .c-clair,.ic .c-clair{fill:var(--rose);opacity:.3;stroke:none}
.craie text{font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic;fill:var(--encre)}
.craie text.rose{fill:var(--rose)}
.titre{position:absolute;left:0;top:0;margin:0;font-weight:760;font-variation-settings:"INFM" 100,"BNCE" 55;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.indice{position:absolute;left:0;top:0;margin:0;font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic;color:var(--rose);white-space:nowrap;line-height:1.2}
.note{position:absolute;left:0;top:0;margin:0;font-size:13px;line-height:1.35;color:var(--gris)}
.note-btn{all:unset;display:inline-block;margin:4px 0 0 6px;padding:0 16px;height:44px;line-height:44px;border-radius:999px;background:var(--rose);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.note-btn:focus-visible{outline:2px dashed var(--rose);outline-offset:3px}
.titre,.indice,.note,.craie,.aimant-libre{transition:opacity .5s}
body.niv1 .titre,body.niv1 .indice,body.niv1 .note,body.niv1 .craie,body.niv1 .aimant-libre{opacity:.3}
.feuille{position:absolute;left:0;top:0;background-color:var(--papier);background-image:linear-gradient(90deg,transparent var(--mg),var(--marge) var(--mg),var(--marge) calc(var(--mg) + var(--gl)*2),transparent calc(var(--mg) + var(--gl)*2)),linear-gradient(var(--carreau) var(--gl),transparent var(--gl)),linear-gradient(90deg,var(--carreau) var(--gl),transparent var(--gl));background-size:100% 100%,var(--g) var(--g),var(--g) var(--g);border-radius:2px;box-shadow:0 1px 1px rgba(43,36,64,.12),0 16px 22px -14px rgba(43,36,64,.45);color:var(--encre)}
.feuille::before,.feuille::after{content:"";position:absolute;left:calc(var(--mg)*.34);width:calc(var(--g)*.62);height:calc(var(--g)*.62);border-radius:50%;background:#E8E6E2;box-shadow:inset 0 1px 2px rgba(43,36,64,.4)}
.feuille::before{top:22%}
.feuille::after{bottom:22%}
.feuille:focus-visible{outline:3px dashed var(--rose);outline-offset:5px}
.annee,.matiere{transform:translate(var(--x),var(--y)) rotate(calc(var(--r)*var(--k,1))) translateY(var(--lev,0px))}
.annee{z-index:3;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .3s,opacity .5s}
.annee:hover,.annee:focus-visible{--k:.3;--lev:-8px;box-shadow:0 1px 1px rgba(43,36,64,.12),0 28px 30px -18px rgba(43,36,64,.55)}
.an-lbl{position:absolute;left:26%;top:9%;font-size:calc(var(--u)*var(--lf,34));font-weight:780;line-height:1;font-variation-settings:"INFM" 100,"BNCE" 60;transform:rotate(-4deg)}
.an-sou{position:absolute;left:23%;top:37%;width:54%;height:calc(var(--u)*7.5)}
.an-nom{position:absolute;left:26%;right:6%;top:46%;font-size:max(13px,calc(var(--u)*8.4));font-weight:620;line-height:1.1}
.an-dessin{position:absolute;left:30%;top:63%;width:44%;height:18%;overflow:visible}
.an-meta{position:absolute;left:26%;right:5%;bottom:5%;font-size:max(12px,calc(var(--u)*6.2));color:var(--gris);line-height:1.2}
.petite .an-dessin,.petite .an-meta{display:none}
.et{color:var(--rose)}
.nw{white-space:nowrap}
.mx{font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;font-style:italic}
.tag{display:none;position:absolute;right:5%;top:5%;padding:4px 10px;border-radius:999px;background:var(--rose);color:#fff;font-size:14px;font-weight:700;transform:rotate(4deg);white-space:nowrap}
.matiere{z-index:2;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .5s}
.matiere.bouge{transition:transform .85s cubic-bezier(.25,.9,.3,1) var(--d,0ms),opacity .5s}
.matiere.active{z-index:6}
.matiere.ouverte{z-index:7}
.matiere.etalee{pointer-events:auto;cursor:pointer}
body.niv1:not(.niv2) .matiere.etalee:hover,body.niv1:not(.niv2) .matiere.etalee:focus-visible{--k:.2;--lev:-7px}
.ma-nom{position:absolute;left:23%;right:5%;top:12%;font-size:calc(var(--su)*var(--fz,12));font-weight:720;line-height:1.02;font-variation-settings:"INFM" 90,"BNCE" 40;text-wrap:balance}
.ma-nom,.ma-ico,.ma-meta{transition:opacity .35s}
.matiere:not(.etalee) .ma-nom,.matiere:not(.etalee) .ma-ico,.matiere:not(.etalee) .ma-meta{opacity:0}
.matiere.etalee.bouge .ma-nom,.matiere.etalee.bouge .ma-ico,.matiere.etalee.bouge .ma-meta{transition:opacity .4s calc(var(--d,0ms) + 380ms)}
.ma-ico{position:absolute;left:31%;top:46%;width:42%;height:26%;overflow:visible}
.ma-meta{position:absolute;left:24%;right:4%;bottom:6%;display:flex;flex-wrap:wrap;gap:.3em .5em;align-items:center;font-size:calc(var(--su)*8.4);color:var(--gris);line-height:1.15}
.pastille{background:var(--rose);color:#fff;border-radius:999px;padding:.08em .55em;font-weight:700;white-space:nowrap}
body.niv1 .annee{pointer-events:none}
body.niv1 main{cursor:zoom-out}
.matiere.etalee .aimant{pointer-events:auto}
body.niv1 .annee:not(.active),body.niv1 .aimant-an:not(.active){opacity:.12}
body.niv1 .matiere:not(.active){opacity:0}
body.niv2 .matiere.active:not(.ouverte){opacity:.2}
.aimant{position:absolute;left:0;top:0;display:block;pointer-events:none}
.aimant svg{display:block;width:100%;height:100%;overflow:visible}
.aimant-an{z-index:4;transform:translate(var(--x),var(--y));transition:opacity .35s}
.aimant-an.parti{opacity:0;transition:opacity .35s .45s}
.aimant-libre{z-index:1}
.matiere .aimant,#ouvert .aimant{left:50%;width:calc(var(--su)*22);height:calc(var(--su)*22);transform:translate(-50%,-56%)}
#ouvert .aimant{z-index:2}
.matiere .aimant{opacity:0;transition:opacity .15s}
.matiere.etalee .aimant{opacity:1}
.matiere.etalee .aimant svg{animation:clac .45s cubic-bezier(.2,1.4,.4,1) var(--da,0ms) both}
.aimant-an.clac svg{animation:clac .45s cubic-bezier(.2,1.4,.4,1) both}
.aimant-an.pop svg{animation:pop .3s ease-out}
@keyframes clac{0%{opacity:0;transform:translateY(-55%) scale(1.8)}60%{opacity:1;transform:translateY(6%) scale(.9)}100%{opacity:1;transform:none}}
@keyframes pop{45%{transform:scale(1.22) rotate(-10deg)}}
#sol{position:fixed;inset:0;z-index:26;pointer-events:none;perspective:1100px}
#sol .feuille{transform-origin:50% 50%}
#sol .au-sol{pointer-events:auto;cursor:pointer}
#sol .au-sol .tag{display:block}
#voile{position:fixed;inset:0;z-index:24;cursor:zoom-out;background:rgba(252,252,250,.72);animation:fondu .3s ease-out}
@keyframes fondu{from{opacity:0}}
#ouvert{position:fixed;z-index:25;opacity:0;transition:opacity .22s;box-shadow:0 30px 60px -34px rgba(43,36,64,.7)}
#ouvert.vu{opacity:1}
#ouvert .defile{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:calc(var(--g)*1.7) calc(var(--g)*.8) calc(var(--g)*1.2) calc(var(--mg) + var(--g)*.6)}
#ouvert h2{margin:0;font-size:clamp(28px,calc(var(--g)*2),46px);font-weight:760;line-height:1.05;letter-spacing:-.01em;font-variation-settings:"INFM" 100,"BNCE" 45;text-wrap:balance;outline:none}
.ou-meta{margin:8px 0 14px;font-size:15px;color:var(--gris)}
.ou-liste{list-style:none;margin:0;padding:0}
.ou-liste li{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;transition-delay:calc(var(--i)*55ms + 140ms)}
#ouvert.vu .ou-liste li{opacity:1;transform:none}
.ou-liste button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:baseline;gap:4px 8px;width:100%;min-height:44px;padding:10px 6px;border-radius:8px;font-size:17px;line-height:1.25;cursor:pointer}
.ou-liste button:hover{background:rgba(255,79,154,.08)}
.ou-liste button:focus-visible{outline:2px dashed var(--rose);outline-offset:1px}
.ou-t{display:flex;align-items:baseline;gap:6px}
.ou-pts{flex:1;min-width:1em;border-bottom:2px dotted #C9C1D6;transform:translateY(-4px)}
.ou-p{color:var(--gris);font-size:15px;white-space:nowrap}
.st{font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-propre{border:1.5px solid var(--encre)}
.st-corr{background:var(--rose);color:#fff}
.st-scan{color:var(--gris);border:1.5px dashed var(--gris)}
.ou-note{margin:18px 0 0;font-size:15px;color:var(--gris)}
#fil{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:30;max-width:calc(100% - 24px);visibility:hidden;transform:translateY(-160%) rotate(-1.5deg);transition:transform .5s cubic-bezier(.3,1.3,.5,1),visibility 0s .5s}
body.niv1 #fil{visibility:visible;transform:rotate(-1.5deg);transition:transform .5s cubic-bezier(.3,1.3,.5,1) .6s,visibility 0s .6s}
#fil ol{display:flex;align-items:center;margin:0;padding:0 20px;list-style:none;background:repeating-linear-gradient(-45deg,#FF5BA2 0 10px,#FF7AB3 10px 20px);clip-path:polygon(0 7px,7px 0,calc(100% - 7px) 0,100% 7px,calc(100% - 5px) 50%,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),5px 50%)}
#fil li{display:flex;align-items:center;flex:none}
#fil li:last-child{flex:0 1 auto;min-width:0}
#fil button{all:unset;display:block;height:44px;line-height:44px;padding:0 6px;color:#fff;font-size:17px;font-weight:700;font-variation-settings:"INFM" 80,"BNCE" 30;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#fil button[aria-current]{cursor:default}
#fil button:focus-visible{outline:2px dashed #fff;outline-offset:-6px}
#fil .sep{color:#FFE9A8;font-size:14px;padding:0 1px}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:70;width:max-content;max-width:calc(100% - 32px);transform:translate(-50%,180%);background:var(--encre);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#toast.vu{transform:translate(-50%,0)}
@media(max-width:520px){#fil ol.trois li:nth-child(-n+2){display:none}}
#ouvert{container-type:inline-size}
@container (max-width:470px){.ou-liste button{grid-template-columns:auto minmax(0,1fr) auto}.ou-liste .st{grid-column:2/4;justify-self:start}}
.fige,.fige *{transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;transition-delay:0ms!important}}

/* ---------- Atelier : scan, OCR, correction ---------- */
#atelier{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(var(--pois) 1.5px,transparent 1.7px) 0 0/24px 24px var(--mur);opacity:0;transition:opacity .25s}
#atelier.vu{opacity:1}
.at-tete{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.at-tete h2{margin:0;font-size:clamp(26px,3.2vw,40px);font-weight:760;line-height:1.05;letter-spacing:-.01em;font-variation-settings:"INFM" 100,"BNCE" 45;outline:none}
.at-info{margin:0;color:var(--gris);font-size:15px}
.at-retour{all:unset;box-sizing:border-box;height:44px;padding:0 20px;color:#fff;font-weight:700;font-size:16px;cursor:pointer;background:repeating-linear-gradient(-45deg,#FF5BA2 0 10px,#FF7AB3 10px 20px);clip-path:polygon(0 7px,7px 0,calc(100% - 7px) 0,100% 7px,calc(100% - 5px) 50%,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),5px 50%);transform:rotate(-1.5deg);white-space:nowrap}
.at-retour:focus-visible,.btn:focus-visible,.at-onglets button:focus-visible,.at-vues button:focus-visible{outline:2px dashed var(--rose);outline-offset:3px}
.at-corps{display:grid;grid-template-columns:minmax(0,var(--g1,1fr)) 22px minmax(0,var(--g2,1.15fr));gap:0;min-height:0}
.at-poignee{position:relative;cursor:col-resize;touch-action:none;border-radius:999px;outline:none}
.at-poignee::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:64px;transform:translate(-50%,-50%);border-radius:999px;background:var(--rose);box-shadow:0 0 0 3px rgba(255,255,255,.85);transition:height .15s}
.at-poignee:hover::before,.at-poignee:focus-visible::before,.at-poignee.on::before{height:120px}
.at-taille{display:flex;gap:6px}
.at-taille button{all:unset;box-sizing:border-box;min-width:44px;height:36px;padding:0 12px;border-radius:999px;border:2px solid var(--encre);font-weight:700;font-size:14px;text-align:center;cursor:pointer;white-space:nowrap}
.at-taille button:focus-visible{outline:2px dashed var(--rose);outline-offset:3px}
.at-taille button[aria-pressed=true]{background:var(--encre);color:#fff}
.at-scan{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0;padding:12px;border-radius:10px;background:#FDFDFB;color:var(--encre);box-shadow:inset 0 1px 6px rgba(43,36,64,.18),0 16px 30px -22px rgba(60,16,48,.6)}
.at-scan::before{content:"";position:absolute;left:50%;top:-10px;width:120px;height:24px;transform:translateX(-50%) rotate(-3deg);background:repeating-linear-gradient(-45deg,rgba(255,91,162,.85) 0 8px,rgba(255,138,192,.85) 8px 16px);z-index:2}
.at-barre{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:32px}
.at-onglets{display:flex;gap:6px;flex-wrap:wrap}
.at-onglets button,.at-vues button{all:unset;box-sizing:border-box;min-width:44px;height:36px;padding:0 12px;border-radius:999px;border:2px solid var(--encre);font-weight:700;font-size:14px;text-align:center;cursor:pointer;white-space:nowrap}
.at-onglets button[aria-pressed=true],.at-vues button[aria-pressed=true]{background:var(--encre);color:#fff}
.at-onglets .err{border-color:var(--rose);color:var(--rose)}
.at-image{position:relative;overflow:auto;min-height:0;border-radius:6px;background:#F1F0EC}
.at-image img{display:block;width:100%;height:auto;cursor:zoom-in}
.at-image.zoom img{width:200%;cursor:zoom-out}
.at-vide{display:grid;place-items:center;align-content:center;gap:12px;min-height:100%;padding:20px;text-align:center;color:var(--gris);font-size:16px}
.at-import{display:inline-block;position:relative}
.at-import input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.at-import input:focus-visible+span{outline:2px dashed var(--rose);outline-offset:3px}
.at-copie{--g:22px;--mg:44px;--gl:1px;position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;padding:12px 12px 12px calc(var(--mg) + 10px)}
.at-copie .at-barre{justify-content:space-between}
.at-vues{display:flex;gap:6px}
.at-reglages{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.at-prec{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--gris)}
.at-prec select{font:inherit;font-size:16px;color:var(--encre);background:#fff;border:2px solid var(--encre);border-radius:10px;height:36px;padding:0 8px}
#at-tex{width:100%;height:100%;min-height:0;resize:none;border:0;outline:none;background:transparent;color:var(--encre);font:calc(14px * var(--zt,1))/1.6 "JetBrains Mono",ui-monospace,Consolas,monospace;padding:6px 4px;tab-size:2}
#at-tex:focus-visible{box-shadow:inset 0 0 0 2px rgba(255,79,154,.5);border-radius:6px}
#at-tex[readonly]{color:#5E5770}
.at-apercu{overflow:auto;min-height:0;padding:4px 6px 20px;font-size:calc(17px * var(--zt,1));line-height:1.5}
.at-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.at-etat{flex:1 1 260px;margin:0;font-size:15px;min-height:22px}
.at-etat.err{color:#C42067;font-weight:700}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px) rotate(-1deg)}
.btn-rose{background:var(--rose);color:#fff}
.btn-encre{background:var(--encre);color:#fff}
.btn-trait{border:2px solid var(--encre);color:var(--encre);background:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.r-titre{margin:4px 0 10px;font-size:28px;line-height:1.1;text-decoration:underline wavy var(--rose) 3px;text-underline-offset:8px}
.r-sec{margin:16px 0 6px;font-size:21px}
.r-sec::before{content:"★ ";color:var(--rose)}
.r-ssec{margin:12px 0 4px;font-size:18px}
.r-ssec::before{content:"☆ ";color:var(--rose)}
.r-b{position:relative;margin:16px 0 10px;padding:16px 12px 8px;border:2px solid var(--rose);border-radius:255px 12px 225px 12px/12px 225px 12px 255px;background:#FFEEF6}
.r-lab{position:absolute;left:10px;top:-13px;padding:1px 10px;background:var(--rose);color:#fff;font-size:14px;font-weight:700;transform:rotate(2deg)}
.r-thm{border-color:var(--encre);border-width:3px}
.r-thm .r-lab,.r-meth .r-lab{background:var(--encre)}
.r-prop{background:#fff}

<section id="atelier" hidden aria-labelledby="at-titre">
  <header class="at-tete"><button type="button" class="at-retour" id="at-retour">← Retour aux fiches</button><h2 id="at-titre" tabindex="-1"></h2><p class="at-info"></p></header>

</section>
<script>
{
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const attendre = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const borne = (a, v, b) => Math.max(a, Math.min(b, v));
const f1 = v => (+v).toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const pl = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;

/* Aucune donnée d'exemple : le tableau n'affiche que tes dossiers */
const EXEMPLES = [];
let ANNEES = EXEMPLES;
const STATUTS = {propre:['propre','st-propre'], corr:['à corriger','st-corr'], scan:['scan seul','st-scan']};
const COUL = {rose:'#FF4F9A', bonbon:'#FF8FC0', jaune:'#FFC93C', lilas:'#A98BFF', ciel:'#5BB8F5', menthe:'#3FC7A0'};
const LIBRES = [['triangle','jaune'],['carre','menthe'],['rond','lilas']];

/* ---------- Trait de feutre : traits tremblés, hasard fixe ---------- */
let graine = 7;
const alea = () => (graine = graine * 16807 % 2147483647) / 2147483647;
const sem = t => { graine = [...t].reduce((a, c) => (a * 31 + c.charCodeAt(0)) & 0x7fffffff, 7) || 7; };
const j = a => (alea() - .5) * 2 * a;
const seg = (x1, y1, x2, y2, a) => `M${f1(x1 + j(a))} ${f1(y1 + j(a))}Q${f1((x1 + x2) / 2 + j(a * 1.8))} ${f1((y1 + y2) / 2 + j(a * 1.8))} ${f1(x2 + j(a))} ${f1(y2 + j(a))}`;
const ligne = (x1, y1, x2, y2, a = 1.1) => seg(x1, y1, x2, y2, a) + seg(x1, y1, x2, y2, a * .8);
const poly = (p, ferme, a = 1.1) => { const q = ferme ? [...p, p[0]] : p; let d = ''; for (let i = 0; i < q.length - 1; i++) d += ligne(q[i][0], q[i][1], q[i + 1][0], q[i + 1][1], a); return d; };
const lisse = p => { let d = `M${f1(p[0][0])} ${f1(p[0][1])}`; for (let i = 0; i < p.length - 1; i++) { const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c; d += `C${f1(b[0] + (c[0] - a[0]) / 6)} ${f1(b[1] + (c[1] - a[1]) / 6)} ${f1(c[0] - (e[0] - b[0]) / 6)} ${f1(c[1] - (e[1] - b[1]) / 6)} ${f1(c[0])} ${f1(c[1])}`; } return d; };
const rond = (cx, cy, rx, ry = rx, a = 1.2) => { const p = [], d0 = alea() * 6.3; for (let i = 0; i <= 22; i++) { const t = d0 + i / 20 * 6.283; p.push([cx + (rx + j(a)) * Math.cos(t), cy + (ry + j(a)) * Math.sin(t)]); } return lisse(p); };
const courbe = (fn, x0, x1, n = 18, a = .5) => lisse(Array.from({length: n + 1}, (_, i) => { const x = x0 + (x1 - x0) * i / n; return [x + j(a), fn(x) + j(a)]; }));
const etoileP = (cx, cy, r, k = 5, ri = .45) => Array.from({length: 2 * k}, (_, i) => { const t = -Math.PI / 2 + i * Math.PI / k, q = i % 2 ? r * ri : r; return [cx + q * Math.cos(t), cy + q * Math.sin(t)]; });
const remp = p => 'M' + p.map(([x, y]) => f1(x + j(.6)) + ' ' + f1(y + j(.6))).join('L') + 'Z';
const P = (d, c) => `<path class="${c}" d="${d}"/>`;

/* ---------- Aimants géométriques ---------- */
const pts = a => a.map(([x, y]) => f1(x) + ',' + f1(y)).join(' ');
const FA = {
  rond: '<circle cx="50" cy="50" r="38"/>',
  carre: '<rect x="15" y="15" width="70" height="70" rx="16"/>',
  hexagone: `<polygon points="${pts(Array.from({length: 6}, (_, i) => [50 + 40 * Math.cos(Math.PI / 6 + i * Math.PI / 3), 50 + 40 * Math.sin(Math.PI / 6 + i * Math.PI / 3)]))}" stroke-width="8" stroke-linejoin="round"/>`,
  triangle: '<polygon points="50,16 86,80 14,80" stroke-width="14" stroke-linejoin="round"/>',
  etoile: `<polygon points="${pts(etoileP(50, 53, 44, 5, .5))}" stroke-width="9" stroke-linejoin="round"/>`,
};
const mix = (a, b, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - t) + parseInt(b.substr(i, 2), 16) * t).toString(16).padStart(2, '0')).join('');
$('#defs').innerHTML = '<defs>' + Object.entries(COUL).map(([n, c]) => `<radialGradient id="g-${n}" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="${mix(c, '#ffffff', .5)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${mix(c, '#2B2440', .32)}"/></radialGradient>`).join('') + '</defs>';
const aimantSVG = ([f, c]) => `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g fill="rgba(43,36,64,.24)" stroke="rgba(43,36,64,.24)" transform="translate(3 7)">${FA[f]}</g><g fill="url(#g-${c})" stroke="url(#g-${c})">${FA[f]}</g><ellipse cx="37" cy="34" rx="12" ry="6" fill="#fff" opacity=".6" transform="rotate(-28 37 34)"/></svg>`;

/* ---------- Petits dessins des matières (100 x 100) ---------- */
const ICONES = {
  des: () => P(poly([[22, 22], [78, 22], [78, 78], [22, 78]], 1), 'c-encre') + [[36, 36], [50, 50], [64, 64]].map(([x, y]) => P(rond(x, y, 4.5, 4.5, .4), 'c-plein')).join(''),
  cloche: () => P(ligne(6, 86, 94, 86), 'c-encre') + P(courbe(x => 86 - 66 * Math.exp(-(((x - 50) / 15) ** 2)), 10, 90, 24, .4), 'c-rose'),
  croix: () => P(poly([[12, 8], [12, 88], [94, 88]]), 'c-encre') + P(ligne(22, 24, 86, 76), 'c-rose') + P(ligne(22, 76, 86, 24), 'c-encre'),
  matrice: () => P(lisse([[32, 12], [20, 15], [18, 50], [20, 85], [32, 88]]), 'c-encre') + P(lisse([[68, 12], [80, 15], [82, 50], [80, 85], [68, 88]]), 'c-encre') + [34, 50, 66].map((x, a) => [32, 50, 68].map((y, b) => P(rond(x, y, 3.2, 3.2, .3), a === b ? 'c-plein' : 'c-jaune')).join('')).join(''),
  droite: () => P(poly([[10, 6], [10, 90], [94, 90]]), 'c-encre') + [[24, 72], [33, 60], [42, 66], [51, 50], [60, 54], [70, 38], [80, 32]].map(([x, y]) => P(rond(x, y, 3, 3, .3), 'c-plein')).join('') + P(ligne(16, 80, 90, 24), 'c-rose'),
  onde: () => P(poly([[8, 8], [8, 90], [94, 90]]), 'c-encre') + P(poly([[14, 62], [24, 40], [33, 56], [43, 28], [53, 50], [62, 36], [72, 62], [82, 40], [92, 48]], 0, .6), 'c-rose'),
  nuage: () => `<g transform="rotate(-32 50 52)">${P(rond(50, 52, 38, 17, 1), 'c-encre')}${[[28, 52], [38, 46], [44, 57], [52, 49], [58, 56], [66, 47], [74, 53]].map(([x, y]) => P(rond(x, y, 2.8, 2.8, .3), 'c-plein')).join('')}${P(ligne(6, 52, 94, 52) + ligne(94, 52, 85, 46) + ligne(94, 52, 85, 58), 'c-rose')}</g>`,
  code: () => P(lisse([[36, 12], [26, 16], [28, 44], [16, 50], [28, 56], [26, 84], [36, 88]]), 'c-encre') + P(lisse([[64, 12], [74, 16], [72, 44], [84, 50], [72, 56], [74, 84], [64, 88]]), 'c-encre') + P(ligne(42, 50, 58, 50), 'c-rose'),

       .replace(/\\\[([\s\S]*?)\\\]/g, m => ph(m, true)).replace(/\$\$([\s\S]*?)\$\$/g, (_, b) => ph(`\\[${b}\\]`, true))

function decouper(src) {
  const L = src.split('\n'), B = []; let cur = [], prof = 0, dd = false, i = 0;
  const n = (c, r) => (c.match(r) || []).length;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim() && prof <= 0 && !dd && cur.length) {
      let j = i; const sep = []; while (j < L.length && !L[j].trim()) { sep.push(L[j]); j++; }
      B.push({txt: cur.join('\n'), sep: '\n' + sep.join('\n') + (j < L.length ? '\n' : '')}); cur = []; i = j; continue;
    }
    cur.push(l); const c = l.replace(/(^|[^\\])%.*$/, '$1');
    prof += n(c, /\\begin\{/g) - n(c, /\\end\{/g) + n(c, /\\\[/g) - n(c, /\\\]/g);
    if (n(c, /\$\$/g) % 2) dd = !dd;
    i++;
  }
  if (cur.length) B.push({txt: cur.join('\n'), sep: ''});
  return B;
}
const blocHTML = b => b.txt.trim() ? texVersHTML(b.txt) : '<p class="at-vide-bloc">(vide)</p>';
/* Si une relecture ou une correction a perdu les zones des dessins, on les remet (dans l'ordre) */
function garderZones(ancien, neuf) {
  const zones = [...String(ancien).matchAll(/\\dessin\s*(\[[^\]]*\])/g)].map(m => m[1]);
  if (!zones.length) return neuf;
  const deja = [...String(neuf).matchAll(/\\dessin\s*\[/g)].length;
  let n = deja;
  return String(neuf).replace(/\\dessin\s*\{/g, m => n < zones.length ? `\\dessin${zones[n++]}{` : m);
}
/* Coordonnées d'un \dessin lu sur une demi-page -> coordonnées sur la page entière */
function recaler(t, bas) {
  return t.replace(/\\dessin\s*\[\s*([-\d.]+)\s*,\s*([-\d.]+)\s*,\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\]/g, (_, a, b, c, d) => {
    const y = v => Math.round((bas ? 45 : 0) + parseFloat(v) * .55);
    return `\\dessin[${a},${y(b)},${c},${y(d)}]`;
  });
}
/* Aperçu : la zone du dessin est découpée dans le scan de sa page */
async function remplirDessins(z) {
  let cour = null;
  for (const el of z.querySelectorAll('.r-saut, .r-img')) {
    if (el.classList.contains('r-saut')) { cour = el.textContent.trim(); continue; }
    if (el.dataset.fait) continue;
    const p = (cour && AT.pages.find(q => q.nom === cour)) || (AT.pages.length === 1 ? AT.pages[0] : null);
    if (!p || !p.blob) continue;
    try {
      const [x1, y1, x2, y2] = el.dataset.box.split(',').map(Number), bm = await createImageBitmap(p.blob), W = bm.width, H = bm.height;
      const bx = Math.max(0, (x1 - 2) / 100 * W), by = Math.max(0, (y1 - 2) / 100 * H), bw = Math.min(W, (x2 + 2) / 100 * W) - bx, bh = Math.min(H, (y2 + 2) / 100 * H) - by;
      if (bw < 10 || bh < 10) continue;
      const c = document.createElement('canvas'); c.width = Math.round(bw); c.height = Math.round(bh);
      c.getContext('2d').drawImage(bm, bx, by, bw, bh, 0, 0, c.width, c.height);
      el.innerHTML = `<img alt="${esc(el.dataset.desc || 'dessin')}" src="${c.toDataURL('image/jpeg', .9)}" style="max-width:${Math.max(25, Math.min(100, (x2 - x1) * 1.15))}%">`;
      el.classList.add('r-img-ok'); el.dataset.fait = '1';
    } catch (e) {}

}
async function dessiner(el) {
  remplirDessins(el.closest('.at-apercu') || el);
  try { await chargerMathJax(); MathJax.typesetClear([el]); await MathJax.typesetPromise([el]); }
  catch (e) { if (el.classList.contains('at-apercu') && !el.querySelector('.r-inc')) el.insertAdjacentHTML('afterbegin', '<p class="r-inc">Les formules ne peuvent pas être dessinées ici : elles restent en LaTeX.</p>'); }
}
async function apercu() {
  const z = at('.at-apercu'), tex = ed().value;
  if (!tex.trim()) { z.innerHTML = '<p class="at-vide">Rien à afficher pour l’instant.</p>'; AT.blocs = []; return; }
  AT.blocs = decouper(tex);
  z.innerHTML = '<p class="at-aide">Clique sur un passage pour le modifier.</p>' + AT.blocs.map((b, i) => `<div class="bl" data-i="${i}" tabindex="0" role="button" aria-label="Modifier ce passage">${blocHTML(b)}</div>`).join('');
  await dessiner(z);
}
function majSource() { ed().value = AT.blocs.map(b => b.txt + b.sep).join(''); AT.sale = true; majBoutons(); brouillonPlusTard(); }
async function fermerBloc(el, ta) {
  const i = +el.dataset.i, b = AT.blocs[i];
  if (!b) return;
  el.classList.remove('edit'); el.innerHTML = blocHTML(b); await dessiner(el);
}
function ouvrirBloc(el) {
  if (el.classList.contains('edit')) return;
  const i = +el.dataset.i, b = AT.blocs[i]; if (!b) return;
  el.classList.add('edit');
  const ta = document.createElement('textarea'); ta.className = 'bl-ta'; ta.spellcheck = false; ta.value = b.txt; ta.setAttribute('aria-label', 'LaTeX de ce passage');
  const ajuste = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 4 + 'px'; };
  ta.addEventListener('input', () => { b.txt = ta.value; majSource(); ajuste(); });
  ta.addEventListener('blur', () => fermerBloc(el, ta));
  ta.addEventListener('keydown', e => { if (e.key === 'Escape' || ((e.ctrlKey || e.metaKey) && e.key === 'Enter')) { e.preventDefault(); e.stopPropagation(); ta.blur(); } });
  el.replaceChildren(ta); ajuste(); ta.focus();
}
at('.at-apercu').addEventListener('click', e => { const el = e.target.closest('.bl'); if (el) ouvrirBloc(el); });
at('.at-apercu').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('bl')) { e.preventDefault(); ouvrirBloc(e.target); } });
$('#at-retour').addEventListener('click', fermerAtelier);

$('#at-save').addEventListener('click', () => enregistrer('corr'));
$('#at-ok').addEventListener('click', () => enregistrer('propre'));

$('#at-v-pdf').addEventListener('click', () => vue('pdf'));
$('#at-v-code').addEventListener('click', () => vue('code'));

$('#at-v-apercu').addEventListener('click', () => vue('apercu'));
ed().addEventListener('input', () => { AT.sale = true; majBoutons(); brouillonPlusTard(); });
at('.at-onglets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { AT.cur = +b.dataset.p; majOnglets(); majImage(); } });
at('.at-image').addEventListener('click', e => { if (e.target.closest('[data-rel]')) { (async () => { for (let i = 0; i < AT.pages.length; i++) if (!AT.pages[i].blob) await chargerPage(i); })(); return; } if (e.target.tagName === 'IMG') e.currentTarget.classList.toggle('zoom'); });

/* Largeur et taille de la transcription */
{
  const corps = at('.at-corps'), po = $('#at-poignee'), box = $('#atelier');
  const largeur = p => { p = borne(20, p, 80); corps.style.setProperty('--g1', p + 'fr'); corps.style.setProperty('--g2', (100 - p) + 'fr'); $('#at-large').setAttribute('aria-pressed', p <= 32); return p; };
  let pct = largeur(46);
  const depuis = x => { const r = corps.getBoundingClientRect(); pct = largeur((x - r.left) / r.width * 100); };
  po.addEventListener('pointerdown', e => { po.setPointerCapture(e.pointerId); po.classList.add('on'); depuis(e.clientX); });
  po.addEventListener('pointermove', e => { if (po.hasPointerCapture(e.pointerId)) depuis(e.clientX); });
  po.addEventListener('pointerup', e => { po.releasePointerCapture(e.pointerId); po.classList.remove('on'); });
  po.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') { pct = largeur(pct - 4); e.preventDefault(); } else if (e.key === 'ArrowRight') { pct = largeur(pct + 4); e.preventDefault(); } });
  $('#at-large').addEventListener('click', () => { pct = largeur(pct <= 32 ? 46 : 28); });
  let zt = 1; const taille = v => { zt = borne(.8, v, 2); box.style.setProperty('--zt', zt.toFixed(2)); };
  $('#at-moins').addEventListener('click', () => taille(zt - .15));
  $('#at-plus').addEventListener('click', () => taille(zt + .15));
}
at('.at-image').addEventListener('change', async e => {
  if (e.target.id !== 'at-fichier') return;
  const fs = [...e.target.files].filter(f => f.type.startsWith('image/')); if (!fs.length) return;
  etat('Préparation des photos…');
  for (const f of fs) { try { const b = await normaliser(f); AT.pages.push({nom: f.name, blob: b, url: URL.createObjectURL(b), etat: 'ok'}); } catch (err) { etat(`Photo illisible : ${f.name}`, true); } }
  AT.cur = 0; majOnglets(); majImage(); majBoutons();

});
(async () => {
